name: Docs

# The samples' documentation, the DocC catalog in Docs/, on this repository's GitHub
# Pages site. The organization site serves the domain:
#
#   /CucumberSwiftSample/      the highest samples release
#   /CucumberSwiftSample/X.x/  the highest samples release of each major
#
# The entry point is https://cucumberswift.org/CucumberSwiftSample/documentation/cucumberswiftsample/
#
# A pull request that changes the catalog or how it is built gets the build, with
# warnings as errors, and deploys nothing. The Release workflow runs the publish job as
# its last job. To redeploy without a release: Docs > Run workflow on main, or
# gh workflow run docs.yml --ref main
#
# Publishing builds nothing and runs no project code: the docs come from the zips
# attached to each release, which .github/scripts/publish-docs.sh unpacks. That script
# is the same as CucumberSwift's and CucumberSwiftExpressions'; keep it so.
on:
  pull_request:
    paths:
      - 'Docs/**'
      - '.github/scripts/build-docs.sh'
      - '.github/scripts/publish-docs.sh'
      - '.github/workflows/docs.yml'
  workflow_call:
    inputs:
      # The release that must be published: Release passes its version, and
      # whether it is Latest. A run by hand publishes whatever the releases hold.
      version:
        type: string
        required: true
      latest:
        type: string
        required: true
  workflow_dispatch:

# Nothing by default; each job asks for what it uses. Only GITHUB_TOKEN is used.
permissions: {}

# `shell: bash` adds `-o pipefail`.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build the documentation
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the toolchain
        run: swift --version
      # Fails on an unresolved link, a missing page or any other warning. It also
      # builds it the way a release does, with a version, to check that path too.
      - name: Build the catalog
        run: |
          .github/scripts/build-docs.sh "$RUNNER_TEMP/site"
          .github/scripts/build-docs.sh "$RUNNER_TEMP/release" 0.0.0

  publish:
    name: Publish to Pages
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    # Up to 10 minutes for deploy-pages and 11 for the site check, after the rest.
    timeout-minutes: 30
    # contents: read -> releases and their assets. pages: write and id-token: write -> deploy.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # One deployment at a time. If a third run queues, GitHub cancels the one
    # waiting. That is safe: each run publishes every release.
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      # The path build-docs.sh builds the docs for.
      DOCS_PATH: CucumberSwiftSample
      MODULE: cucumberswiftsample
      # No release was built for another path.
      FORMER_PATHS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Unpack the docs of the releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/publish-docs.sh "$RUNNER_TEMP/site"
      # The script skips a release whose docs do not fit and uses an older one.
      # For a release, fail instead, before anything is deployed.
      - name: Check that the release is in the docs
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
          LATEST: ${{ inputs.latest }}
        run: |
          site="$RUNNER_TEMP/site/versions.json"
          major=$(jq -r --arg m "${VERSION%%.*}.x" '.majors[] | select(.major == $m) | .version' "$site")
          if [ "$major" != "$VERSION" ]; then
            echo "::error::${VERSION%%.*}.x shows ${major:-nothing}, not $VERSION."
            exit 1
          fi
          if [ "$LATEST" = true ] && [ "$(jq -r .version "$site")" != "$VERSION" ]; then
            echo "::error::The root shows $(jq -r .version "$site"), not $VERSION."
            exit 1
          fi
          # The overview's heading, above the title, is "Version X.Y.Z" (build-docs.sh
          # adds it). Only this release's pages are checked.
          pages=("${VERSION%%.*}.x/")
          if [ "$LATEST" = true ]; then pages+=(""); fi
          for dir in "${pages[@]}"; do
            heading=$(jq -r .metadata.roleHeading "$RUNNER_TEMP/site/${dir}data/documentation/$MODULE.json")
            if [ "$heading" != "Version $VERSION" ]; then
              echo "::error::/$DOCS_PATH/$dir shows the heading \"$heading\", not \"Version $VERSION\"."
              exit 1
            fi
          done
          echo "$VERSION is published."
      # One artifact per attempt: deploy-pages fails if a re-run finds two with the same name.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      # A deployment can report success and leave the previous site online, as when
      # this job is re-run for a commit that is already deployed. Fail visibly then.
      # Pages caches files for up to 10 minutes, so wait a little longer than that.
      - name: Check that the site serves the new docs
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          for _ in $(seq 1 66); do
            if curl -fsSL "${PAGE_URL%/}/versions.json" | cmp -s - "$RUNNER_TEMP/site/versions.json"; then
              echo "The site serves the new docs."
              exit 0
            fi
            sleep 10
          done
          echo "::error::The site still serves the previous docs. Run Docs by hand to publish them."
          exit 1

name: CI

# Builds and tests every sample in Tuist/ twice: with the CucumberSwift that its
# Project.swift asks for (normally the latest release), and with CucumberSwift's main.
# Nightly runs catch a CucumberSwift change that breaks a sample.
#
# A sample can ask for a CucumberSwift version that is not released yet. Its "release" job
# then passes without building the sample, and says so in a notice; its "main" job still
# tests it. Once the version is released, the release job builds it with no change here.
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One test job per sample folder, so a new sample needs no change here.
  samples:
    name: List the samples
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      samples: ${{ steps.list.outputs.samples }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: |
          samples=$(find Tuist -mindepth 2 -maxdepth 2 -name Project.swift | cut -d/ -f2 | sort | jq -R . | jq -sc .)
          echo "Samples: $samples"
          echo "samples=$samples" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.sample }} with CucumberSwift ${{ matrix.cucumber-swift }}
    needs: samples
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        sample: ${{ fromJSON(needs.samples.outputs.samples) }}
        # "release" is the dependency each Project.swift declares: the latest release.
        cucumber-swift: [release, main]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Decides before the toolchain and Tuist steps, so a skipped sample costs little.
      - name: Check CucumberSwift has released what ${{ matrix.sample }} asks for
        id: released
        if: matrix.cucumber-swift == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          SAMPLE: ${{ matrix.sample }}
        run: ./scripts/release-gate.sh "$SAMPLE"
      - name: Check out CucumberSwift main
        if: matrix.cucumber-swift == 'main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cucumberswift/CucumberSwift
          ref: main
          path: build/CucumberSwift
          persist-credentials: false
      - name: Show the toolchain
        if: steps.released.outputs.build != 'false'
        run: |
          xcodebuild -version
          swift --version
      - name: Install mise
        if: steps.released.outputs.build != 'false'
        run: command -v mise || brew install mise
      - name: Install the pinned Tuist
        if: steps.released.outputs.build != 'false'
        env:
          # mise verifies the download's checksum through the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: |
          mise --version
          mise install
      - name: Test ${{ matrix.sample }}
        if: steps.released.outputs.build != 'false'
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
          CUCUMBER_SWIFT_PATH: ${{ matrix.cucumber-swift == 'main' && format('{0}/build/CucumberSwift', github.workspace) || '' }}
          SAMPLE: ${{ matrix.sample }}
        run: mise run test "$SAMPLE"

  # The one check the ruleset on main requires, so adding a sample needs no ruleset change.
  passed:
    name: All samples pass
    needs: [samples, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the sample jobs
        env:
          SAMPLES: ${{ needs.samples.result }}
          TESTS: ${{ needs.test.result }}
        run: |
          echo "List the samples: $SAMPLES. Test jobs: $TESTS."
          [ "$SAMPLES" = success ] && [ "$TESTS" = success ]
